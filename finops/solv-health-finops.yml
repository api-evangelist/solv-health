description: >-
  FinOps view of Solv Health spend. Solv is bought as a per-location clinic/
  health-system subscription (annual, quarterly, or monthly), not metered
  per-API-call; solvhealth.com states packages are "priced per location, not
  per user" with cost dependent on the bundle of features (scheduling, intake,
  patient acquisition, reputation management, messaging, payments, EHR
  interoperability, Final Mile/widget API access) included in a custom
  proposal. There is no published per-request, per-booking, or per-sync rate
  for the Final Mile, Booking Widget, or EHR Interoperability capabilities,
  since none of them are billed through a public metered API. The consumer
  marketplace (solvhealth.com, Solv app) is free to patients.
notes: >-
  No public per-unit rates exist to reconcile. This file reflects only the
  qualitative, per-location subscription model described on
  solvhealth.com/for-providers/pricing; verify actual contract economics
  directly with Solv sales.
sources:
- https://www.solvhealth.com/for-providers/pricing
- https://www.solvhealth.com/for-providers/integrations
- https://focus.finops.org/focus-specification/v1-3/
