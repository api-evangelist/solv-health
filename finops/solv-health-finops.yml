meters:
- name: locations
  description: Number of clinic/health-system locations subscribed to Solv; the disclosed basis for per-location package pricing.
  unit: locations
  aggregation: count
  dimensions:
  - account
  - region
- name: ehr_sync_events
  description: Bidirectional patient demographic, appointment, and document sync events between Solv and a connected EHR/EMR. Not separately metered publicly.
  unit: events
  aggregation: count
  dimensions:
  - account
  - ehr_vendor
- name: final_mile_handoffs
  description: Virtual-to-in-person patient handoffs routed through the Solv Final Mile network/API. Not separately metered publicly.
  unit: handoffs
  aggregation: count
  dimensions:
  - account
  - partner
principles:
- name: Visibility
  description: Track subscribed locations and which package tier (and therefore which API/EHR capabilities) each is billed under.
- name: Allocation
  description: Map Solv spend to the clinics, urgent care sites, or health-system service lines generating the bookings and EHR syncs.
- name: Optimization
  description: Consolidate EHR interoperability and Final Mile network participation across locations to avoid redundant per-location provisioning.
- name: Accountability
  description: Assign contract ownership to clinic operations/marketing; review annual or quarterly renewal terms against actual booking volume and location count.
