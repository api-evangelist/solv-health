serviceCategory: Digital Health / Patient Scheduling Platform
billingModel:
  pricingCategory: Enterprise Contract
  billingFrequency: Annual, Quarterly, or Monthly
  billingCurrency: USD
  chargeCategories:
  - Usage
  - Purchase
focusColumns:
  ServiceName: Solv Health Platform
  ServiceCategory: Digital Health / Patient Scheduling Platform
  ProviderName: Solv Health
  PublisherName: Solv Health
  InvoiceIssuerName: Solv Health
