name: Solv Health
kind: company
description: Solv Health operates a consumer marketplace (solvhealth.com and the Solv
  app) for booking same-day urgent care, primary care, and lab appointments, plus a
  provider-facing platform (scheduling, intake, patient acquisition, reputation
  management, messaging, payments) sold to clinics and health systems. There is no
  self-serve public developer API or published API reference on solvhealth.com; API
  access is gated behind a sales-led partnership. Solv states it exposes
  "interoperable APIs" that power custom booking experiences on partner websites and
  apps, a "Final Mile" API/network that lets digital-first and virtual-care partners
  (e.g. Included Health) hand patients off to real-time same-day appointment
  availability at Solv's national network of urgent care clinics, and bidirectional
  EHR interoperability (APIs, HL7, FHIR, and RPA) that syncs patient demographics,
  appointment status, and documents with systems like Epic, Athena, Cerner,
  Allscripts, DrChrono, eClinicalWorks, Experity, and NextGen. None of these
  capabilities have a published base URL, endpoint reference, or self-serve API key
  signup; access is provisioned per partner/clinic inside a commercial contract.
