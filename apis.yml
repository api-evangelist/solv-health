apis:
- aid: solv-health:solv-health-final-mile-api
  name: Solv Final Mile API
  tags:
  - Availability
  - Booking
  - Virtual Care Handoff
  - Final Mile
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://www.solvhealth.com/for-providers/build
  properties:
  - url: https://www.solvhealth.com/for-providers/build
    type: Documentation
  - url: https://www.prnewswire.com/news-releases/solv-launches-final-mile-network-enabling-handoff-between-virtual-care-navigators-and-local-in-person-providers-to-complete-a-critical-path-in-the-care-continuum-301743169.html
    type: Documentation
  description: Real-time same-day appointment availability and booking capability
    that lets digital-first and virtual-care partners (telehealth navigators,
    health plans) hand a patient off to an in-person visit at a clinic in Solv's
    national urgent care network. Announced publicly via the "Solv Final Mile
    Network" (partners include Included Health); described in marketing only as
    "proprietary APIs and tools" with no published base URL, endpoint list, or
    request/response schema.
  endpointsModeled: true
- aid: solv-health:solv-health-booking-widget-api
  name: Solv Booking Widget API
  tags:
  - Widget
  - Scheduling
  - Website Embed
  - Patient Experience
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://www.solvhealth.com/for-providers/health-systems
  properties:
  - url: https://www.solvhealth.com/for-providers/health-systems
    type: Documentation
  - url: https://www.solvhealth.com/for-providers/integrations
    type: Documentation
  description: Interoperable API that powers a custom, white-labeled digital
    patient-booking experience embedded on a health system or clinic's own
    website and mobile app - surfacing real-time local urgent care and lab
    availability under the partner's own brand. Solv markets this as "plug-and-
    play APIs and dedicated developers," but publishes no public API reference,
    base URL, or self-serve credential flow; delivery is hands-on with Solv's
    own developers as part of a paid engagement.
  endpointsModeled: true
- aid: solv-health:solv-health-ehr-interoperability-api
  name: Solv EHR Interoperability API
  tags:
  - EHR
  - EMR
  - HL7
  - FHIR
  - Sync
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://www.solvhealth.com/for-providers/integrations
  properties:
  - url: https://www.solvhealth.com/for-providers/integrations
    type: Documentation
  description: Bidirectional interoperability layer that automatically syncs
    patient demographics, appointment details, and media (insurance cards, ID,
    consent forms) into a clinic's electronic health record, and syncs patient
    status back out in real time to support wait-time and throughput metrics.
    Solv states it connects "through standard healthcare interfaces, including
    APIs, HL7, FHIR, and robotic process automation (RPA)" to EHR/EMR systems
    such as Epic, Athena, Cerner, Allscripts, DrChrono, eClinicalWorks,
    Experity, NextGen, and Advanced. No public API reference, base URL, or
    self-serve credentials are published; each connection is configured by
    Solv's implementation team per EHR vendor and per customer.
  endpointsModeled: true
